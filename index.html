<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hygia Pharmacy Admission</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Form Section -->
        <div class="formData" id="formData">
            <h2>Pharmacy Course Admission</h2>
            <p>
                Interested in pursuing a Pharmacy course in Lucknow?
                Fill out the form below and our admission team will contact you within 12 hours.
            </p>
            <div class="dataForm" id="admissionForm">
                <div>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                <div>
                    <label for="mobile">Contact Number</label>
                    <input type="number" id="mobile" name="contactNumber" placeholder="Enter your mobile number" maxlength="10"
                        required>
                </div>
                <div class="godata">
                    <label for="highschool">High School Percentage</label>
                    <input type="text" id="highschool" name="highSchool" placeholder="Example: 82.5" min="0" max="100"
                        required>
                </div>
                <div class="godata">
                    <label for="intermediate">Intermediate Percentage</label>
                    <input type="text" id="intermediate" name="intermediate" placeholder="Example: 75.4" min="0"
                        max="100" required>
                </div>
                <div>
                    <label for="whatsapp">WhatsApp Number</label>
                    <input type="number" id="whatsapp" name="whatsappNumber" placeholder="Enter WhatsApp Number" maxlength="10"
                        required>
                </div>
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>
                <div>
                    <label for="address">Full Address</label>
                    <input type="text" id="address" name="fullAddress" placeholder="Enter your address" required>
                </div>
                <button id="sedto" type="submit">Submit</button>
            </div>

        </div>

        <!-- Thank You Section -->
        <div class="thankDiv" id="thankDiv">

            <h2>Thank You!</h2>
            <p>
                Your information has been submitted successfully.
                Our admission team will contact you within the next 12 hours.
            </p>

            <button id="whatsappMessage">
                Chat on WhatsApp
            </button>

        </div>

    </div>

</body>
<script src="index.js"></script>
</html>
